to all women, regardless of musical experience. The group grows rapidly, affirming the collective singing as an inclusive practice rooted in popular music.</span></p><p><span style="font-weight: 400;">In 2024, the group experiences an internal crisis following the arrival of new members and the unexpected departure of its founder, initiating a process of reorganization that becomes a hard emotional negotiation</span><span style="font-weight: 400;"> to exercise democracy within a large collective</span></p><p><span style="font-weight: 400;">The Choir is then asked to perform at the National Parliament during the celebration of the 50th anniversary of the Carnations Revolution, singing about freedom and democracy at the same time they strugle to apply the same values within their group. </span></p><p><span style="font-weight: 400;">The film reflects the contemporary challenges of collective life and democratic practice, following the choir as a living organism, where singing together becomes a continuous negotiation between listening, conflict, care, and community-building.</span></p><figure class="post__image"><figure class="post__image"><img loading="lazy" src="https://vasco-monteiro.github.io/Vasco-Monteiro-Portfolio/media/posts/43/OperariasdaVoz_018_assembleia.jpg" alt="" width="2590" height="3775" sizes="(max-width: 1920px) 100vw, 1920px" srcset="https://vasco-monteiro.github.io/Vasco-Monteiro-Portfolio/media/posts/43/responsive/OperariasdaVoz_018_assembleia-xs.jpg 640w, https://vasco-monteiro.github.io/Vasco-Monteiro-Portfolio/media/posts/43/responsive/OperariasdaVoz_018_assembleia-sm.jpg 768w, https://vasco-monteiro.github.io/Vasco-Monteiro-Portfolio/media/posts/43/responsive/OperariasdaVoz_018_assembleia-md.jpg 1024w, https://vasco-monteiro.github.io/Vasco-Monteiro-Portfolio/media/posts/43/responsive/OperariasdaVoz_018_assembleia-lg.jpg 1366w, https://vasco-monteiro.github.io/Vasco-Monteiro-Portfolio/media/posts/43/responsive/OperariasdaVoz_018_assembleia-xl.j
